en:
  entra_id:
    menu_title: Microsoft Entra ID
    errors:
      login_failed: Sign-in with Microsoft Entra ID failed. Try again or contact your administrator.
      connection_error: Microsoft Entra ID could not be reached. Please try again in a few minutes.
      entra_error: Microsoft Entra ID cancelled or rejected the sign-in.
      invalid_state: The sign-in session expired or is invalid. Click the Microsoft button again.
      invalid_response: The response from Microsoft Entra ID is incomplete.
      not_in_allowed_group: Your Microsoft account is not a member of a group allowed to use OpenProject.
      graph_error: Your group membership in Microsoft Entra ID could not be verified.
      user_not_found: Your Microsoft account has no OpenProject user. Ask your administrator for access.
      account_locked: Your OpenProject user is locked.
      invalid_user: Your OpenProject user could not be created or updated. Contact your administrator.
      activation_failed: Your OpenProject user could not be activated (check user limit or registration settings).
    settings:
      description: Sign in with Microsoft Entra ID (OpenID Connect) for OpenProject Community.
      section_app: Entra app registration
      section_access: Access restriction
      section_users: Users
      redirect_uri: Redirect URI
      redirect_uri_help: Register it in Entra > App registrations > Authentication > Web platform. It is based on the host name and protocol in Administration > System.
      secret_saved: "•••••• (saved; leave empty to keep it)"
      secret_help: 'Client secret value (not the secret ID). Recommended: set it with ''openproject config:set ENTRA_ID_CLIENT_SECRET=...''.'
      clear_secret: Remove the stored secret
      from_env: Set by environment variable %{var}
      allowed_groups_help: Object IDs of allowed Entra groups, comma or line separated. Empty = any user in the tenant. Checked on every sign-in (nested groups included).
      login_upn: User principal name (UPN)
      login_mail: Email
      linked_users:
        zero: No users linked yet.
        one: 1 user linked to Entra ID.
        other: "%{count} users linked to Entra ID."
      incomplete: 'Sign-in is enabled but these are missing or invalid: %{fields}. The button stays hidden until fixed.'
      saved_with_errors: 'Saved, but these are missing or invalid: %{fields}.'
      test_button: Test tenant connection
      test_ok: 'Connection OK. Issuer: %{issuer}'
      test_issuer_mismatch: The tenant returned an unexpected issuer (%{issuer}). Check the tenant ID.
      test_failed: 'Could not reach the tenant: %{message}'
      fields:
        enabled: Enable Entra ID sign-in
        tenant_id: Directory (tenant) ID
        client_id: Application (client) ID
        client_secret: Client secret
        button_label: Button text
        allowed_group_ids: Allowed groups
        auto_create_users: Create users automatically
        link_existing_users: Link existing users
        update_user_on_login: Update profile on each sign-in
        login_attribute: Login attribute
        button_logo: Button logo
        custom_logo: Company logo
        local_login_mode: Username and password sign-in
        logo_layout: Logo layout
      help:
        auto_create_users: Creates the OpenProject user on first sign-in. If disabled, only existing users can sign in.
        link_existing_users: If no link exists, finds an existing user with the same login or email and links it to the Entra account (once; never relinked to another account).
        update_user_on_login: Syncs first name, last name and email from Entra on sign-in.
      section_appearance: Sign-in page appearance
      remove_logo: Remove the uploaded logo
      custom_logo_help: 'PNG, JPG, GIF, WEBP or SVG up to %{max} KB. Recommended size: 400 × 122 px (3.28:1 ratio) with transparent background; other sizes are scaled without distortion. Uploading switches the button to the company logo.'
      local_login_help: 'Collapsed: the Microsoft button comes first and the form appears when clicking "Use username and password". Hidden: only Microsoft is shown; administrators can always sign in with a password at %{url}'
      logo_empty: The logo file is empty.
      logo_too_big: The logo exceeds the maximum size of %{max} KB. The logo was not changed.
      logo_bad_type: The file is not a PNG, JPG, GIF, WEBP or SVG image. The logo was not changed.
      logo_unsafe_svg: The SVG contains scripts, event handlers or external links and was rejected. The logo was not changed.
      logos:
        key: Key (default)
        microsoft: Microsoft logo
        custom: Company logo (uploaded)
        none: No logo
      local_modes:
        visible: Visible (as usual)
        collapsed: Collapsed, with a link to show it
        hidden: Hidden (Microsoft only)
      logo_layout_help: Only for the Microsoft or company logo. "Full button" shows only the logo; the text is kept for screen readers.
      logo_layouts:
        inline: Inline, left of the text
        above: Above the text (200 × 61 box)
        full: Full button (logo only, up to 400 × 122)
    login:
      show_local: Use username and password
      hide_local: Hide username and password sign-in
